<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Educational browser-only registration prototype. Not production authentication.">
    <link rel="stylesheet" href="../css/cssmain.css">
    <link rel="stylesheet" href="../css/registerPage.css">
    <title>Educational Registration Prototype</title>
</head>

<body>
    <form class="registerForm" id="registerForm">
        <p class="demo-warning">
            Educational browser-only prototype. Do not use a real password or sensitive email address.
        </p>

        <label for="username">Username:</label>
        <input
            type="text"
            name="username"
            id="username"
            placeholder="Operator ID"
            class="form-input"
            autocomplete="username"
            minlength="3"
            required
        >

        <label for="password">Password:</label>
        <input
            type="password"
            name="password"
            id="password"
            placeholder="Min. 8 chars, 1 symbol"
            class="form-input"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <label for="email">Email Address:</label>
        <input
            type="email"
            name="email"
            id="email"
            placeholder="example@email.com"
            class="form-input"
            autocomplete="email"
            required
        >

        <button type="submit" id="registerButton" class="btn primary">Register</button>
        <div id="showMessage" class="messageBox" role="status" aria-live="polite"></div>

        <a href="../index.html">Return to portfolio</a>
    </form>

    <script src="../js/managers/userManager.js"></script>
    <script src="../js/registerScript.js"></script>
</body>
</html>
