<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Educational browser-only login prototype. Not production authentication.">
    <link rel="stylesheet" href="../css/cssmain.css">
    <link rel="stylesheet" href="../css/loginPage.css">
    <title>Educational Login Prototype</title>
</head>

<body>
    <form class="loginForm" id="loginForm">
        <p class="demo-warning">
            Educational browser-only prototype. Do not use a real password.
        </p>

        <label for="username">Username:</label>
        <input
            type="text"
            name="username"
            id="username"
            placeholder="Operator ID"
            class="form-input"
            autocomplete="username"
            required
        >

        <label for="password">Password:</label>
        <input
            type="password"
            name="password"
            id="password"
            placeholder="Demo password"
            class="form-input"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginButton" class="btn primary">Login</button>
        <div id="showMessage" class="messageBox" role="status" aria-live="polite"></div>

        <a href="../index.html">Return to portfolio</a>
    </form>

    <script src="../js/managers/userManager.js"></script>
    <script src="../js/loginScript.js"></script>
</body>
</html>
